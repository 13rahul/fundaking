    <text x="104" y="384" fill="#FFFFFF" font-size="22" font-weight="700">Build list (examples of thinking, not a blast list)</text>
    <text x="104" y="410" fill="#A8C0D0" font-size="15">GBP (non-negotiable) · Industry marketplaces your buyers already use (e.g. relevant B2B directories for manufacturing)</text>
