<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Timeline to rank for competitive local SEO keywords</title>
  <desc id="desc">Phased timeline for SEO consultant Pune ranking efforts</desc>
  <rect width="960" height="540" rx="16" fill="#12121a"/>
  <text x="48" y="52" fill="#ffffff" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Realistic timeline: competitive local keywords</text>
  <text x="48" y="82" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="15">Phases for head terms like SEO consultant in Pune (practitioner model)</text>
  <line x1="80" y1="280" x2="880" y2="280" stroke="#3a3a4a" stroke-width="4"/>
  <circle cx="160" cy="280" r="14" fill="#937AFF"/>
  <text x="160" y="240" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Weeks 14</text>
  <text x="160" y="330" text-anchor="middle" fill="#a8a8b8" font-size="12">Technical cleanup</text>
  <text x="160" y="350" text-anchor="middle" fill="#a8a8b8" font-size="12">Entity / NAP alignment</text>
  <text x="160" y="370" text-anchor="middle" fill="#a8a8b8" font-size="12">Cluster outline + GBP</text>
  <circle cx="400" cy="280" r="14" fill="#937AFF"/>
  <text x="400" y="240" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Months 24</text>
  <text x="400" y="330" text-anchor="middle" fill="#a8a8b8" font-size="12">Supporting content</text>
  <text x="400" y="350" text-anchor="middle" fill="#a8a8b8" font-size="12">Internal links + reviews</text>
  <text x="400" y="370" text-anchor="middle" fill="#a8a8b8" font-size="12">Selective mentions / links</text>
  <circle cx="640" cy="280" r="14" fill="#4D36D0"/>
  <text x="640" y="240" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Months 48</text>
  <text x="640" y="330" text-anchor="middle" fill="#a8a8b8" font-size="12">Long-tail hiring queries</text>
  <text x="640" y="350" text-anchor="middle" fill="#a8a8b8" font-size="12">move first, then head</text>
  <text x="640" y="370" text-anchor="middle" fill="#a8a8b8" font-size="12">term stability</text>
  <circle cx="840" cy="280" r="14" fill="#3a3a4a"/>
  <text x="840" y="240" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Ongoing</text>
  <text x="840" y="330" text-anchor="middle" fill="#a8a8b8" font-size="12">GSC ’ pipeline</text>
  <text x="840" y="350" text-anchor="middle" fill="#a8a8b8" font-size="12">GEO re-tests</text>
  <rect x="48" y="420" width="864" height="72" rx="10" fill="#1a1a26" stroke="#937AFF"/>
  <text x="68" y="452" fill="#937AFF" font-size="14" font-weight="700">Research anchor:</text>
  <text x="68" y="476" fill="#e8e8ef" font-size="13">Organic local SEO often needs 36+ months for meaningful competitive movement  aligned with BrightLocal / industry practitioner surveys on local campaign timelines.</text>
  <text x="48" y="520" fill="#666" font-size="12">Fundaking Media  illustrative phases, not a ranking guarantee.</text>
