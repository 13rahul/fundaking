<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Local search click share by result type</title>
  <desc id="desc">Approximate share of clicks on local-intent searches for map pack, organic, and paid results</desc>
  <rect width="960" height="540" rx="16" fill="#12121a"/>
  <text x="48" y="56" fill="#ffffff" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Where local-intent clicks go</text>
  <text x="48" y="88" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="15">Aggregated user-behavior studies on searches with local intent (20242025)</text>
  <rect x="48" y="130" width="120" height="280" rx="8" fill="#937AFF"/>
  <text x="78" y="200" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" transform="rotate(-90 78 200)">Map pack 44%</text>
  <rect x="188" y="178" width="120" height="232" rx="8" fill="#4D36D0"/>
  <text x="218" y="240" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" transform="rotate(-90 218 240)">Organic 29%</text>
  <rect x="328" y="206" width="120" height="204" rx="8" fill="#5c5c7a"/>
  <text x="358" y="260" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" transform="rotate(-90 358 260)">Paid 19%</text>
  <rect x="468" y="254" width="120" height="156" rx="8" fill="#3a3a4a"/>
  <text x="498" y="300" fill="#ccc" font-family="system-ui,sans-serif" font-size="13" transform="rotate(-90 498 300)">Other 8%</text>
  <text x="620" y="160" fill="#ffffff" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Map pack position CTR (typical)</text>
  <text x="620" y="200" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="15">#1 ’ ~17.6% · #2 ’ ~15.4% · #3 ’ ~15.1%</text>
  <text x="620" y="240" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="14">First Page Sage / local SERP behavior studies (2025)</text>
  <rect x="620" y="270" width="292" height="140" rx="12" fill="#1a1a26" stroke="#937AFF" stroke-width="1"/>
  <text x="640" y="305" fill="#937AFF" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Takeaway for Pune service firms</text>
  <text x="640" y="332" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="14">Clinics &amp; map-led services: GBP + reviews</text>
  <text x="640" y="356" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="14">B2B / SaaS: organic clusters still drive</text>
  <text x="640" y="380" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="14">high-intent hiring searches</text>
  <text x="48" y="460" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="13">Sources: Backlinko local behavior (2024); BrightLocal / Moz / Red Local Agency compilations citing ~4244% map pack click share.</text>
  <text x="48" y="508" fill="#666" font-family="system-ui,sans-serif" font-size="12">Fundaking Media  not a guarantee of rankings; illustrates industry-reported behavior.</text>
</svg>
