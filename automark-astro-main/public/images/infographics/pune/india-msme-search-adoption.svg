<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">India MSME search and digital adoption</title>
  <desc id="desc">Research highlights on MSME use of Google Search and digital marketing in India</desc>
  <rect width="960" height="540" rx="16" fill="#12121a"/>
  <text x="48" y="56" fill="#ffffff" font-family="system-ui,sans-serif" font-size="26" font-weight="700">India MSMEs &amp; search-led discovery</text>
  <text x="48" y="88" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="15">Why Pune founders invest in organic + local visibility (20242025 research)</text>
  <rect x="48" y="120" width="260" height="160" rx="12" fill="#1a1a26" stroke="#937AFF" stroke-width="2"/>
  <text x="68" y="168" fill="#937AFF" font-family="system-ui,sans-serif" font-size="42" font-weight="700">43%</text>
  <text x="68" y="200" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">MSMEs advertising on</text>
  <text x="68" y="224" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">Google Search (survey)</text>
  <rect x="348" y="120" width="260" height="160" rx="12" fill="#1a1a26" stroke="#937AFF" stroke-width="2"/>
  <text x="368" y="168" fill="#937AFF" font-family="system-ui,sans-serif" font-size="42" font-weight="700">58%</text>
  <text x="368" y="200" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">MSMEs using search-led</text>
  <text x="368" y="224" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">channels for demand (2025)</text>
  <rect x="648" y="120" width="264" height="160" rx="12" fill="#1a1a26" stroke="#937AFF" stroke-width="2"/>
  <text x="668" y="168" fill="#937AFF" font-family="system-ui,sans-serif" font-size="42" font-weight="700">85%</text>
  <text x="668" y="200" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">MSME leaders: Google</text>
  <text x="668" y="224" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="16">Search ads critical to success</text>
  <text x="48" y="320" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Gap = opportunity for organic SEO</text>
  <rect x="48" y="340" width="864" height="56" rx="8" fill="#937AFF" opacity="0.25"/>
  <rect x="48" y="340" width="112" height="56" rx="8" fill="#937AFF"/>
  <text x="68" y="375" fill="#12121a" font-family="system-ui,sans-serif" font-size="15" font-weight="700">~13%</text>
  <text x="180" y="375" fill="#e8e8ef" font-family="system-ui,sans-serif" font-size="15">of MSMEs report active digital marketing use  most competition still under-invests in SEO depth</text>
  <text x="48" y="430" fill="#a8a8b8" font-family="system-ui,sans-serif" font-size="13">Sources: Google &amp; India SME Forum, The Google Dividend (2025); Digitally Empowered MSMEs report; Fortune India coverage of ISF survey.</text>
  <text x="48" y="508" fill="#666" font-family="system-ui,sans-serif" font-size="12">Fundaking Media  infographic for educational use</text>
</svg>
