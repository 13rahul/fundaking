  <text x="576" y="186" text-anchor="middle" fill="#A8C0D0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">URL maps, 301s, sitemap swaps, Search Console monitoring — a practical SEO checklist fo…</text>
