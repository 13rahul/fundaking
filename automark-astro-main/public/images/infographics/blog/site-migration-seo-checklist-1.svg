    <text x="104" y="268" fill="#3EC6D4" font-size="15" font-weight="700">Part 1 · Technical SEO</text>
    <text x="104" y="296" fill="#FFFFFF" font-size="22" font-weight="700">Pre-launch</text>
    <text x="104" y="322" fill="#A8C0D0" font-size="15">1. Export all indexed URLs (GSC + crawl). 2. Build a 1:1 URL map — old → new. No map, no launch. 3. Preserve title/H1 intent on m…</text>
    <line x1="104" y1="342" x2="1048" y2="342" stroke="#1A4A5C" stroke-width="1"/>
    <text x="104" y="356" fill="#3EC6D4" font-size="15" font-weight="700">Part 2 · Technical SEO</text>
    <text x="104" y="384" fill="#FFFFFF" font-size="22" font-weight="700">Launch day</text>
    <text x="104" y="410" fill="#A8C0D0" font-size="15">Deploy redirects before or with the new site · Submit new sitemap; remove obsolete sitemap refs</text>
    <line x1="104" y1="430" x2="1048" y2="430" stroke="#1A4A5C" stroke-width="1"/>
